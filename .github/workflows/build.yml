name: Zostaviť APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Zostaviť APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk Domov.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Domov
          path: Domov.apk

      # Pracovné buildy (správa commitu obsahuje [bez-release]) sa len zostavia, release sa nevytvorí
      - name: Release
        if: ${{ !contains(github.event.head_commit.message, '[bez-release]') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Domov (build ${{ github.run_number }})
          files: Domov.apk
