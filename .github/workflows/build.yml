name: Zostaviť APK a Domov PC

on:
  push:
    branches: [main, master, pc-ovladanie]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Go + Java testy PC časti na Linuxe: protokol, server, QR, logika ovládania na telefóne
  # a Java klient proti skutočnému PC programu s falošnou obrazovkou
  pc-testy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Testy PC časti
        shell: bash
        run: sh tools/run-pc-tests.sh 2>&1 | tee "$RUNNER_TEMP/pc-testy.log"

      - name: Log (ladenie)
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh tools/ci-log.sh pc-testy "$RUNNER_TEMP/pc-testy.log"

  # Program pre Windows: testy, samotest skutočného zachytenia obrazovky a vstupov, potom domov-pc.exe
  pc-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Kontrola kódu
        shell: bash
        run: go vet ./... 2>&1 | tee -a "$RUNNER_TEMP/pc-windows.log"

      - name: Testy
        shell: bash
        run: go test -count=1 -v ./... 2>&1 | tee -a "$RUNNER_TEMP/pc-windows.log"

      - name: Samotest (zachytenie obrazovky, myš, schránka)
        if: always()
        shell: bash
        run: go run . -selftest 2>&1 | tee -a "$RUNNER_TEMP/pc-windows.log"

      - name: Test celej cesty (párovanie, obraz, vstupy)
        if: always()
        shell: bash
        run: go run . -e2e 2>&1 | tee -a "$RUNNER_TEMP/pc-windows.log"

      - name: Log (ladenie)
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh ../tools/ci-log.sh pc-windows "$RUNNER_TEMP/pc-windows.log"

      - name: Zostaviť domov-pc.exe
        run: go build -trimpath -ldflags "-H=windowsgui -s -w" -o ../domov-pc.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: Domov-PC
          path: domov-pc.exe

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Zostaviť APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon 2>&1 | tee "$RUNNER_TEMP/android.log"
          cp app/build/outputs/apk/release/app-release.apk Domov.apk

      - name: Log (ladenie)
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh tools/ci-log.sh android "$RUNNER_TEMP/android.log"

      - uses: actions/upload-artifact@v4
        with:
          name: Domov
          path: Domov.apk

  release:
    needs: [pc-testy, pc-windows, build]
    runs-on: ubuntu-latest
    # Release sa robí len z hlavnej vetvy; pracovné buildy (správa commitu obsahuje [bez-release]) sa len zostavia
    if: ${{ (github.ref_name == 'main' || github.ref_name == 'master') && !contains(github.event.head_commit.message, '[bez-release]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Domov

      - uses: actions/download-artifact@v4
        with:
          name: Domov-PC

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Domov (build ${{ github.run_number }})
          files: |
            Domov.apk
            domov-pc.exe
